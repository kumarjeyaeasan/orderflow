[project]
name = "orderflow-common"
version = "0.1.0"
description = "Shared cross-cutting code: logging, correlation IDs (later: outbox, idempotency, resilience)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "structlog>=24",
    "starlette>=0.38",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/orderflow_common"]
