[project]
name = "orderflow"
version = "0.1.0"
description = "OrderFlow — microservices patterns lab (workspace root)"
requires-python = ">=3.12,<3.13"
dependencies = []

[tool.uv]
package = false

[tool.uv.workspace]
members = ["libs/common", "monolith"]

[tool.uv.sources]
orderflow-common = { workspace = true }
monolith = { workspace = true }

[dependency-groups]
dev = [
    "orderflow-common",
    "monolith",
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "testcontainers[postgres]>=4",
    "httpx>=0.27",
    "ruff>=0.6",
    "mypy>=1.11",
]

# ---------- ruff ----------
[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "ASYNC", "RUF", "N", "BLE"]

[tool.ruff.lint.isort]
known-first-party = ["monolith", "orderflow_common"]

# ---------- mypy ----------
[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
warn_unused_configs = true

[[tool.mypy.overrides]]
module = ["orderflow_common", "orderflow_common.*"]
strict = true

# ---------- pytest ----------
[tool.pytest.ini_options]
testpaths = ["monolith/tests", "libs/common/tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
addopts = "-ra --strict-markers --import-mode=importlib"
markers = [
    "component: needs Docker (testcontainers)",
    "e2e: runs against the live stack",
]
