[project]
name = "monolith"
version = "0.1.0"
description = "OrderFlow Phase 0 modular monolith"
requires-python = ">=3.12,<3.13"
dependencies = [
    "orderflow-common",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29",
    "alembic>=1.13",
]

[tool.uv.sources]
orderflow-common = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/monolith"]
